services:
  - type: web
    name: myraid-saas-backend
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: myraid-saas-backend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CACHE_BACKEND
        value: django.core.cache.backends.locmem.LocMemCache
      - key: CORS_ALLOWED_ORIGINS
        value: https://myraid.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://myraid.vercel.app
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: CSRF_COOKIE_SAMESITE
        value: None
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: DEFAULT_FROM_EMAIL
        value: noreply@myraid.local
      - key: RAZORPAY_MODE
        value: test
